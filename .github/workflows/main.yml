name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Générer le projet Android
        run: flutter create --platforms=android --org com.lunikapp --project-name manette_batterie app
      - name: Copier les sources
        run: |
          rm -rf app/lib
          cp -r lib app/lib
          D=app/android/app/src/main/kotlin/com/lunikapp/manette_batterie
          mkdir -p $D
          cp native/*.kt $D/
          cp native/AndroidManifest.xml app/android/app/src/main/AndroidManifest.xml
      - name: Build APK
        working-directory: app
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: manette-batterie-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
